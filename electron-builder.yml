appId: com.okasha.restaurantpos
productName: Restaurant POS
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,PROJECT_GUIDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!convert-logo.js'
  - '!resources/logo-source.webp'
  - '!resources/icon-*.png'
asarUnpack:
  - resources/**
  - '**/*.node'
win:
  executableName: RestaurantPOS
  icon: build/icon.ico
nsis:
  artifactName: restaurant-pos-1.1-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: true